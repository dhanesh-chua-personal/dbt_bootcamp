version: 2

sources:
  - name: dev_bootcamp
    database: bootcamp
    schema: dev_bootcamp
    tables:
      - name: orders_bronze
        columns:
          - name: O_ORDERKEY
            description: Primary key of the orders table
            tests:
              - unique
              - not_null
      - name: customer_bronze
        columns:
          - name: C_CUSTKEY
            description: Primary key of the customer table
            tests:
              - unique
              - not_null
      - name: lineitem_bronze
        columns:
          - name: L_ORDERKEY
            tests:
              - unique:
                  config:
                    severity: warn
              - not_null
